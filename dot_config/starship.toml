command_timeout = 3000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$mise\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
format = '([\[$conflicted$stashed$index_added$index_modified$index_deleted$renamed$typechanged$worktree_modified$worktree_deleted$untracked$ahead_behind\]]($style) )'
index_added = 'S+${count}'
index_modified = 'S~${count}'
index_deleted = 'S-${count}'
worktree_modified = 'W~${count}'
worktree_deleted = 'W-${count}'
untracked = '?${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "[$duration]($style) "

[mise]
format = "[$symbol($version )]($style)"
symbol = "mise "
style = "bold blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
